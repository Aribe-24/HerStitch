<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HerStitch | Handmade Crochet Flowers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --rose: #b55d7a;
      --sage: #6f8f72;
      --cream: #f9f2e7;
      --ink: #3b2f2f;
      --soft: #fffaf3;
      --line: #eaded3;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', sans-serif; color: var(--ink); background: linear-gradient(135deg, var(--cream), #fff); line-height: 1.6; }
    a { color: inherit; text-decoration: none; }
    h1, h2, h3 { font-family: 'Playfair Display', serif; letter-spacing: 0.2px; }
    header { background: linear-gradient(90deg, var(--rose), var(--sage)); color: white; padding: 1rem 2rem; position: sticky; top: 0; z-index: 10; box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
    nav { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; max-width: 1200px; margin: 0 auto; }
    nav .brand { font-size: 1.3rem; font-weight: 700; letter-spacing: 0.04em; }
    nav a { margin-left: 1rem; font-weight: 600; padding-bottom: 0.25rem; transition: opacity 0.2s ease; }
    nav a:hover { opacity: 0.85; }
    nav a.active { border-bottom: 2px solid white; }
    .hero { padding: 4rem 2rem; display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 2rem; align-items: center; max-width: 1200px; margin: 0 auto; }
    .hero-card, .panel, .card { background: rgba(255,255,255,0.95); border-radius: 24px; box-shadow: 0 15px 40px rgba(76,58,47,0.08); border: 1px solid var(--line); }
    .hero-card { padding: 2.2rem; }
    .hero-card h1 { font-size: 2.6rem; margin-bottom: 1rem; }
    .hero-card p { line-height: 1.8; color: #5c4f4f; }
    .btn { display: inline-block; padding: 0.9rem 1.3rem; border-radius: 999px; background: var(--rose); color: white; margin-top: 1rem; border: none; cursor: pointer; font-weight: 600; box-shadow: 0 10px 24px rgba(181,93,122,0.22); }
    .btn.secondary { background: var(--sage); box-shadow: 0 10px 24px rgba(111,143,114,0.2); }
    .section { padding: 0 2rem 2.2rem; max-width: 1200px; margin: 0 auto; }
    .panel { padding: 1.6rem 2rem; margin-bottom: 1rem; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 1rem; }
    .card { padding: 1rem; }
    .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 16px; }
    .card h3 { margin-bottom: 0.3rem; }
    .highlight { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--sage); font-weight: 600; margin-bottom: 0.8rem; }
    .feature-list { display: grid; gap: 0.8rem; margin-top: 1rem; }
    .feature-list div { display: flex; align-items: center; gap: 0.6rem; }
    form { display: grid; gap: 0.8rem; }
    input, textarea, select { padding: 0.9rem; border: 1px solid #ddd; border-radius: 12px; font: inherit; background: #fffcf8; }
    footer { background: var(--ink); color: #f5eadf; padding: 2rem; text-align: center; margin-top: 2rem; }
    @media (max-width: 760px) { .hero { grid-template-columns: 1fr; padding-top: 2rem; } nav { justify-content: center; } nav a { margin: 0 0.5rem; } }
  </style>
</head>
<body>
  <header>
    <nav>
      <div class="brand"><i class="fa-solid fa-seedling"></i> HerStitch</div>
      <div>
        <a href="/" class="{% if active_page == 'home' %}active{% endif %}">Home</a>
        <a href="/shop" class="{% if active_page == 'shop' %}active{% endif %}">Shop</a>
        <a href="/about" class="{% if active_page == 'about' %}active{% endif %}">About</a>
        <a href="/custom-orders" class="{% if active_page == 'custom-orders' %}active{% endif %}">Custom Orders</a>
        <a href="/contact" class="{% if active_page == 'contact' %}active{% endif %}">Contact</a>
      </div>
    </nav>
  </header>

  {% block content %}{% endblock %}

  <footer>
    <p>Crafted by Jovin and Joan · Handmade crochet flowers for every celebration.</p>
  </footer>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.querySelector('form');
      if (form) {
        form.addEventListener('submit', () => {
          const button = form.querySelector('button');
          if (button) button.textContent = 'Sending...';
        });
      }

      const cards = document.querySelectorAll('.card');
      cards.forEach((card, index) => {
        card.style.opacity = '0';
        card.style.transform = 'translateY(18px)';
        setTimeout(() => {
          card.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
          card.style.opacity = '1';
          card.style.transform = 'translateY(0)';
        }, 120 * index);
      });
    });
  </script>
</body>
</html>
